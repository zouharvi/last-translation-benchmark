[project]
name = "last-translation-benchmark"
version = "0.0.1"
description = "A platform for collecting difficult-to-translate inputs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Vilém Zouhar", email = "vilem.zouhar@gmail.com" }]
keywords = [
    "translation",
    "benchmark",
    "annotation",
    "human evaluation",
]
dependencies = [
    "fastapi >= 0.110",
    "uvicorn >= 0.29",
    "httpx >= 0.27",
    "deep-translator >= 1.11",
    "aiosqlite >= 0.20",
    "lara-sdk >= 1.13",
    "cohere >= 5.11",
    "openrouter >= 1.1",
    "jsonschema >= 4.26",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.4",
    "pre-commit >= 4.6",
    "ruff >= 0.16",
    "lingtypology >= 0.8",
    "openai >= 2.0",
    "compact-json >= 1.8",
]

[project.urls]
Repository = "https://github.com/zouharvi/last-translation-benchmark"
Issues = "https://github.com/zouharvi/last-translation-benchmark/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { last_translation_benchmark = "server" }
packages = ["last_translation_benchmark"]

[tool.ruff.lint]
ignore = ["BLE001", "TRY002", "ASYNC230"]


